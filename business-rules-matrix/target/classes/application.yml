spring:
  application:
    name: business-rules-matrix

  datasource:
    url: jdbc:h2:mem:businessrulesdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8099

decision:
  rules:
    - coordinate:
        customerType: VIP
        accountStatus: ACTIVE
        productType: LOAN
      ruleType: CREDIT_APPROVAL
      parameters:
        minCreditScore: 600
        maxDebtRatio: 0.4
    - coordinate:
        customerType: VIP
        accountStatus: ACTIVE
        productType: INVESTMENT
      ruleType: PREMIUM_BENEFIT
      parameters:
        benefitMessage: "Exclusive VIP investment package with priority access"
    - coordinate:
        customerType: REGULAR
        accountStatus: ACTIVE
        productType: LOAN
      ruleType: CREDIT_APPROVAL
      parameters:
        minCreditScore: 700
        maxDebtRatio: 0.35
    - coordinate:
        customerType: REGULAR
        accountStatus: ACTIVE
        productType: INVESTMENT
      ruleType: DISCOUNT
      parameters:
        discountPercentage: 10
    - coordinate:
        customerType: NEW
        accountStatus: ACTIVE
        productType: LOAN
      ruleType: CREDIT_APPROVAL
      parameters:
        minCreditScore: 750
        maxDebtRatio: 0.3
    - coordinate:
        customerType: NEW
        accountStatus: ACTIVE
        productType: INVESTMENT
      ruleType: COMMISSION
      parameters:
        commissionPercentage: 2.5
    - coordinate:
        customerType: VIP
        accountStatus: ACTIVE
        productType: INSURANCE
      ruleType: DISCOUNT
      parameters:
        discountPercentage: 20
    - coordinate:
        customerType: REGULAR
        accountStatus: ACTIVE
        productType: INSURANCE
      ruleType: COMMISSION
      parameters:
        commissionPercentage: 5.0

decision-tree:
  rule-files:
    - rules/decision-tree-gates.drl
    - rules/decision-tree-loan.drl
    - rules/decision-tree-investment.drl
    - rules/decision-tree-insurance.drl

